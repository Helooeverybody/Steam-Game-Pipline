image:
  registry: docker.io
  repository: bitnamilegacy/mongodb
  tag: "8.0.12"

architecture: standalone

auth:
  rootPassword: "password"
  usernames:
    - admin
  passwords:
    - password
  databases:
    - steam_analytics

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "1Gi"
    cpu: "500m"

persistence:
  enabled: true
  size: 8Gi
