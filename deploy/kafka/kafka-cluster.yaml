# 1. Defines the nodes (pods) of our Kafka cluster using the stable v1 API
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: main-pool          # A name for our node pool
  namespace: kafka         # Deploy in the 'kafka' namespace
  labels:
    strimzi.io/cluster: my-kafka-cluster # Links this pool to the Kafka resource below
spec:
  replicas: 1              # We only need one pod for our project
  roles:
    - controller
    - broker               # This single pod will do both jobs
  storage:
    type: persistent-claim
    size: 50Gi             # Using the default 'local-path' storage from k3s
    deleteClaim: true      # Cleans up storage when the cluster is deleted
---
# 2. Defines the cluster-wide configuration using the stable v1 API
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: my-kafka-cluster  # Must match the cluster label in the NodePool
  namespace: kafka
spec:
  kafka:
    version: 4.0.0         # Using the new Kafka version
    # The metadataVersion tells Kafka which KRaft version to use. This is important for upgrades.
    # For Kafka 4.0.0, the underlying KRaft version is still based on the 3.x series. 3.7-IV4 is a safe choice.
    metadataVersion: "3.7-IV4" 
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: external
        port: 9094
        type: nodeport
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  # Zookeeper is not needed and is absent from the spec
  entityOperator:
    topicOperator: {}
    userOperator: {}