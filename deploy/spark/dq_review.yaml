apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: ScheduledSparkApplication
metadata:
  name: dq-review
  namespace: default
spec:
  # Cron schedule: Runs every 10 minutes (reviews feed Gold hourly aggregation)
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulRunHistoryLimit: 1
  failedRunHistoryLimit: 3

  template:
    type: Python
    pythonVersion: "3"
    mode: cluster
    image: "frostedpilot/spark:finalv5"
    sparkVersion: "3.5.4"

    mainApplicationFile: "local:///opt/spark/app/dq_review.py"

    restartPolicy:
      type: Never

    sparkConf:
      "spark.sql.shuffle.partitions": "8"

    driver:
      cores: 1
      memory: "1g"
      serviceAccount: spark-operator-spark
      env:
        - name: PYSPARK_PYTHON
          value: /usr/bin/python3
        - name: SPARK_VERSION
          value: "3.5"
      volumeMounts:
        - name: ivy-cache
          mountPath: /tmp

    executor:
      cores: 2
      instances: 3
      memory: "1g"
      volumeMounts:
        - name: ivy-cache
          mountPath: /tmp

    # Definition required for the volumeMounts above
    volumes:
      - name: ivy-cache
        emptyDir: {}
