apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: spark-history
  namespace: default
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "frostedpilot/spark:finalv5"
  sparkVersion: "3.5.4"

  mainApplicationFile: "local:///opt/spark/app/raw_clean_history.py"

  restartPolicy:
    type: Never

  sparkConf:
    "spark.sql.shuffle.partitions": "8"

  driver:
    cores: 2
    memory: "2g"
    serviceAccount: spark-operator-spark
    env:
      - name: PYSPARK_PYTHON
        value: /usr/bin/python3
      - name: SPARK_VERSION
        value: "3.5"
      - name: BACKFILL
        value: "true"
    volumeMounts:
      - name: ivy-cache
        mountPath: /tmp

  executor:
    cores: 1
    instances: 2
    memory: "1g"
    volumeMounts:
      - name: ivy-cache
        mountPath: /tmp
