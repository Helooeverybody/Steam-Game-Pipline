---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: 'Steam Analytics'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 15
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
